name: SeniorResident
options:
  bundleIdPrefix: com.myseniorresident
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Team in Xcode > Signing & Capabilities
    SWIFT_VERSION: "5.9"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  SeniorResident:
    type: application
    platform: iOS
    sources:
      - path: SeniorResident
      - path: Shared
    dependencies:
      - package: Supabase
      - target: SeniorResidentWidget
    entitlements:
      path: SeniorResident/SeniorResident.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.myseniorresident.app]
    info:
      path: SeniorResident/Info.plist
      properties:
        CFBundleDisplayName: My Senior Resident
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Take a photo of a practice question to coach it, or of your question bank's subject list to build your study plan.
        NSPhotoLibraryUsageDescription: Choose a screenshot of a practice question or your question bank's subject list.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.myseniorresident.app
            CFBundleURLSchemes: [seniorresident]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myseniorresident.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  SeniorResidentWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.myseniorresident.app]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: My Senior Resident
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myseniorresident.app.widget
        TARGETED_DEVICE_FAMILY: "1,2"
