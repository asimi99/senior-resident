<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>My Senior Resident</title><link rel="stylesheet" href="panel.css"></head>
<body>
<iframe id="coach" src="about:blank" title="My Senior Resident" allow="clipboard-write; identity-credentials-get"></iframe>
<div class="bar">
  <span id="msg"></span>

</body></html>
